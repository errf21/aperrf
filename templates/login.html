<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script>try{var t=localStorage.getItem('errfpanel_theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
<title>errf · Sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon-errfpanel.svg">
<link rel="apple-touch-icon" href="/static/img/favicon-180.png">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="auth-console">
{% include "_icons.html" %}
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="auth-bar">
  <span class="brand-lockup">
    <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="errf"><use href="#brand-e"/></svg>
    <span class="wordmark">errf</span>
  </span>
  <span class="auth-bar-actions">
    <div class="lang-toggle">
      <button type="button" data-lang="fa">FA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="themeToggle" title="theme">
      <svg><use href="#icon-moon"/></svg>
    </button>
  </span>
</header>

<main class="auth-main">
  <section class="hero-brand stagger-in">
    <span class="eyebrow" data-i18n="auth_eyebrow">CLOUD NETWORK CONTROL</span>
    <h1 class="hero-title"><span class="sheen" data-i18n="brand_short">errf</span></h1>
    <p class="hero-sub" data-i18n="login_hero_sub">فضای مدیریت شما امن و در حال اجراست — برای ادامه وارد شوید.</p>
    <div class="hero-meta">
      <span data-i18n="setup_meta_free">رایگان و متن‌باز</span>
      <span class="dot-sep"></span>
      <span data-i18n="login_meta_note">دسترسی فقط برای مدیر پنل</span>
    </div>
  </section>

  <section class="auth-panel stagger-in">
    <div class="panel-title" data-i18n="login_title">ورود به فضای مدیریت</div>
    <p class="panel-sub" data-i18n="login_sub">برای ادامه، وارد حساب مدیر خود شوید</p>

    <form id="loginForm" class="shake-target" autocomplete="off">
      <div class="field">
        <label data-i18n="setup_username_label">نام کاربری</label>
        <div class="input-wrap">
          <svg class="input-icon"><use href="#icon-user-circle"/></svg>
          <input class="input" type="text" id="username" name="username" required autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label data-i18n="setup_password_label">رمز عبور</label>
        <div class="input-wrap">
          <svg class="input-icon"><use href="#icon-key"/></svg>
          <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="input-toggle" data-toggle-for="password"><svg width="18" height="18"><use href="#icon-eye"/></svg></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block form-gap" id="loginBtn">
        <span class="btn-label" data-i18n="login_submit">ورود</span>
      </button>
    </form>
  </section>
</main>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/common.js"></script>
<script>
document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => { ERRF.setLang(btn.dataset.lang); });
});
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = ERRF.getTheme() === 'dark' ? 'light' : 'dark';
  ERRF.setTheme(next);
});
document.querySelectorAll('[data-toggle-for]').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.toggleFor);
    const isPw = input.type === 'password';
    input.type = isPw ? 'text' : 'password';
    btn.innerHTML = isPw
      ? '<svg width="18" height="18"><use href="#icon-eye-off"/></svg>'
      : '<svg width="18" height="18"><use href="#icon-eye"/></svg>';
  });
});

const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  ERRF.setLoading(btn, true);
  try {
    await ERRF.api('/api/login', { method: 'POST', body: { username, password } });
    ERRF.toast(ERRF.t('login_success'), 'success');
    setTimeout(() => window.location.href = '/dashboard', 500);
  } catch (err) {
    ERRF.setLoading(btn, false);
    ERRF.shake(form);
    let msg = ERRF.t('login_failed');
    if ((err.detail || '').startsWith('locked:')) msg = ERRF.t('login_locked');
    ERRF.toast(msg, 'error');
  }
});
</script>
</body>
</html>
